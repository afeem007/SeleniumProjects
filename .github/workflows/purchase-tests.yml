name: Purchase UI tests

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile production and test code
        run: mvn --batch-mode --no-transfer-progress -DskipTests test

  purchase-tests:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: qa
      QA_BASE_URL: https://rahulshettyacademy.com/client
      BROWSER: chrome
      HEADLESS: "true"
      QA_TEST_USER_EMAIL: ${{ secrets.QA_TEST_USER_EMAIL }}
      QA_TEST_USER_PASSWORD: ${{ secrets.QA_TEST_USER_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Chrome is available
        run: google-chrome --version

      - name: Run Purchase suite
        run: mvn --batch-mode --no-transfer-progress -P Purchase test

      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purchase-test-reports
          path: |
            target/surefire-reports/
            target/cucumber.html
            report/
            reportss/
          if-no-files-found: ignore
          retention-days: 7

name: Manual cross-browser UI tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purchase-tests:
    name: Purchase tests (${{ matrix.browser }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]
    env:
      APP_ENV: qa
      QA_BASE_URL: https://rahulshettyacademy.com/client
      BROWSER: ${{ matrix.browser }}
      HEADLESS: "true"
      QA_TEST_USER_EMAIL: ${{ secrets.QA_TEST_USER_EMAIL }}
      QA_TEST_USER_PASSWORD: ${{ secrets.QA_TEST_USER_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Purchase suite
        run: mvn --batch-mode --no-transfer-progress -P Purchase test

      - name: Upload browser test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purchase-${{ matrix.browser }}-reports
          path: |
            target/surefire-reports/
            report/
            reportss/
          if-no-files-found: ignore
          retention-days: 7
